<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الجدول الدراسي — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body data-protected="student"><header class="app-header"><div><div class="brand-title">منصة يوسف علاء التعليمية</div><div class="brand-subtitle">الجدول الدراسي الموحد</div></div><div class="header-actions"><a href="/student-dashboard.html" class="platform-btn">لوحة الطالب</a><button data-logout class="platform-btn danger">خروج</button></div></header><main class="app-main"><div class="page-title"><h1>الجدول الدراسي</h1><p>مواعيد الحصص والاختبارات المرتبطة بكورساتك.</p></div><section id="schedule-list" class="platform-grid platform-grid-2"></section></main><script type="module" src="/platform.js"></script><script type="module">window.addEventListener('youssef-auth-ready',async(e)=>{const P=window.YoussefAlaaPlatform,u=e.detail?.appUser,box=document.querySelector('#schedule-list');if(!P||!u)return;try{const s=await P.getDocs(P.query(P.collection(P.db,'sessions'),P.where('published','==',true),P.limit(100)));const rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.startAt).localeCompare(String(b.startAt)));box.innerHTML=rows.map(x=>`<article class="platform-panel"><span class="platform-badge">${String(x.type||'حصة')}</span><h3>${String(x.title||'حصة').replace(/[&<>\"]/g,'')}</h3><p>${String(x.startAt||'').replace(/[&<>\"]/g,'')} ${String(x.endAt||'').replace(/[&<>\"]/g,'')}</p><p style="color:#5b6072">الكورس: ${String(x.courseId||'').replace(/[&<>\"]/g,'')}</p>${x.joinUrl?`<a class="platform-btn primary" target="_blank" rel="noopener" href="${String(x.joinUrl).replace(/"/g,'&quot;')}">الدخول للحصة</a>`:''}</article>`).join('')||'<div class="platform-empty">لا توجد حصص منشورة حاليًا.</div>'}catch(err){box.innerHTML='<div class="platform-empty">تعذر تحميل الجدول.</div>'}});</script></body></html>

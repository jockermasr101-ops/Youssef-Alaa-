<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأمان والسجل — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body data-protected="admin"><main class="app-main"><div class="page-title"><h1>الأمان والسجلات</h1><p>مراجعة النشاط والأجهزة المسجلة.</p></div><section class="platform-panel"><h2>الأجهزة</h2><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>UID</th><th>معرّف الجهاز</th><th>البيئة</th><th>آخر ظهور</th><th>إجراء</th></tr></thead><tbody id="devices-body"></tbody></table></div></section><section class="platform-panel" style="margin-top:14px"><h2>سجل النشاط</h2><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>الحدث</th><th>UID</th><th>التفاصيل</th><th>الوقت</th></tr></thead><tbody id="logs-body"></tbody></table></div></section></main><script type="module" src="/platform.js"></script><script type="module" src="/admin.js"></script><script type="module">window.addEventListener('youssef-auth-ready',async(e)=>{const P=window.YoussefAlaaPlatform;if(!['admin','owner'].includes(e.detail?.appUser?.role))return;const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const dbody=document.querySelector('#devices-body');const load=async()=>{try{const s=await P.getDocs(P.query(P.collection(P.db,'deviceSessions'),P.orderBy('lastSeenAt','desc'),P.limit(300)));dbody.innerHTML=s.docs.map(d=>{const x=d.data();return `<tr><td>${esc(x.uid)}</td><td>${esc(x.deviceId)}</td><td>${esc(x.label)}</td><td>${x.lastSeenAt?.toDate?x.lastSeenAt.toDate().toLocaleString('ar-EG'):'—'}</td><td><button class="platform-btn danger" data-revoke-device="${d.id}">إلغاء الجهاز</button></td></tr>`}).join('')||'<tr><td colspan="5" class="platform-empty">لا توجد أجهزة.</td></tr>';dbody.querySelectorAll('[data-revoke-device]').forEach(b=>b.onclick=async()=>{try{await P.deleteDoc(P.doc(P.db,'deviceSessions',b.dataset.revokeDevice));P.messageBox('تم إلغاء الجهاز.','success');load()}catch(err){P.messageBox(err.message)}})}catch(err){dbody.innerHTML=`<tr><td colspan="5" class="platform-empty">${esc(err.message)}</td></tr>`}};load()});</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المالية — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body data-protected="admin"><main class="app-main"><div class="page-title"><h1>المالية وطلبات السحب</h1><p>تسجيل المبيعات، العمولة، الصافي واعتماد السحب يدويًا.</p></div><section class="platform-panel"><h2>تسجيل عملية بيع</h2><form id="sale-form" class="platform-grid platform-grid-3"><div><label class="platform-label">معرّف المدرس</label><input id="sale-teacher" class="platform-input" required></div><div><label class="platform-label">معرّف الطالب</label><input id="sale-student" class="platform-input"></div><div><label class="platform-label">معرّف الكورس</label><input id="sale-course" class="platform-input"></div><div><label class="platform-label">إجمالي البيع</label><input id="sale-amount" class="platform-input" type="number" min="1" required></div><div><label class="platform-label">نسبة العمولة %</label><input id="sale-commission-rate" class="platform-input" type="number" min="0" max="100" step="0.01" value="15"></div><div class="platform-actions" style="align-items:end"><button type="submit" class="platform-btn primary">تسجيل البيع</button></div></form></section><section class="platform-panel" style="margin-top:14px"><h2>طلبات السحب</h2><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>المدرس</th><th>المبلغ</th><th>الطريقة</th><th>الحساب</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody id="withdrawals-body"></tbody></table></div></section></main><script type="module" src="/platform.js"></script><script type="module" src="/admin.js"></script><script type="module">window.addEventListener('youssef-auth-ready',async(e)=>{const P=window.YoussefAlaaPlatform,f=document.querySelector('#sale-form');if(!f)return;f.addEventListener('submit',async ev=>{ev.preventDefault();try{const teacherId=document.querySelector('#sale-teacher').value.trim(),amount=Number(document.querySelector('#sale-amount').value),rate=Number(document.querySelector('#sale-commission-rate').value);const commission=Math.round(amount*rate)/100,net=amount-commission;await P.addDoc(P.collection(P.db,'transactions'),{type:'sale',teacherId,studentUid:document.querySelector('#sale-student').value.trim()||null,courseId:document.querySelector('#sale-course').value.trim()||null,amount,commissionAmount:commission,netAmount:net,createdAt:P.serverTimestamp(),createdBy:P.auth.currentUser.uid});if(commission>0)await P.addDoc(P.collection(P.db,'transactions'),{type:'commission',teacherId,amount:commission,netAmount:0,rate,createdAt:P.serverTimestamp(),createdBy:P.auth.currentUser.uid});if(document.querySelector('#sale-student').value.trim()&&document.querySelector('#sale-course').value.trim())await P.setDoc(P.doc(P.db,'enrollments',`${document.querySelector('#sale-student').value.trim()}_${document.querySelector('#sale-course').value.trim()}`),{studentUid:document.querySelector('#sale-student').value.trim(),courseId:document.querySelector('#sale-course').value.trim(),teacherId,source:'admin_sale',amount,active:true,createdAt:P.serverTimestamp(),updatedAt:P.serverTimestamp()},{merge:true});P.messageBox('تم تسجيل البيع وحساب العمولة.','success');f.reset()}catch(err){P.messageBox(err.message)}})});</script></body></html>

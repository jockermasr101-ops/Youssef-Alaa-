<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بنك الأسئلة والامتحانات — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body data-protected="teacher"><header class="app-header"><div><div class="brand-title">منصة يوسف علاء التعليمية</div><div class="brand-subtitle">بنك الأسئلة والامتحانات</div></div><div class="header-actions"><a class="platform-btn" href="/teacher-dashboard.html">لوحة المدرس</a><button data-logout class="platform-btn danger">خروج</button></div></header><main class="app-main"><div class="page-title"><h1>الامتحانات وبنك الأسئلة</h1><p>3 محاولات افتراضية، ترتيب وأسئلة قابلة للعشوائية، وأنواع أسئلة متعددة.</p></div><section class="platform-panel"><h2>إنشاء امتحان</h2><form id="exam-form" class="platform-grid platform-grid-3"><div><label class="platform-label">اسم الامتحان</label><input id="exam-title" class="platform-input" required></div><div><label class="platform-label">معرّف الكورس</label><input id="exam-course" class="platform-input" required placeholder="courseId"></div><div><label class="platform-label">المدة بالدقائق</label><input id="exam-duration" class="platform-input" type="number" min="1" value="30"></div><div><label class="platform-label">عدد المحاولات</label><input id="exam-attempts" class="platform-input" type="number" min="1" max="10" value="3"></div><div><label class="platform-label">عدد الأسئلة</label><input id="exam-count" class="platform-input" type="number" min="1" value="20"></div><div><label class="platform-label">درجة النجاح %</label><input id="exam-pass" class="platform-input" type="number" min="1" max="100" value="50"></div><div><label class="platform-label">سياسة الدرجة</label><select id="exam-policy" class="platform-select"><option value="highest">أعلى محاولة</option><option value="latest">آخر محاولة</option></select></div><div><label class="platform-label">الرجوع للسؤال السابق</label><select id="exam-back" class="platform-select"><option value="true">مسموح</option><option value="false">غير مسموح</option></select></div><div><label class="platform-label">إظهار الإجابات بعد التسليم</label><select id="exam-show" class="platform-select"><option value="false">لا</option><option value="true">نعم</option></select></div><div><label class="platform-label">اختبار مفاجئ</label><select id="exam-surprise" class="platform-select"><option value="false">لا</option><option value="true">نعم</option></select></div><div class="platform-actions" style="grid-column:1/-1"><button class="platform-btn primary" type="submit">حفظ الامتحان</button></div></form></section><section class="platform-panel" style="margin-top:14px"><h2>إضافة سؤال</h2><form id="question-form" class="platform-grid platform-grid-2"><div><label class="platform-label">الامتحان</label><select id="q-exam" class="platform-select" required><option value="">جارٍ تحميل الامتحانات...</option></select></div><div><label class="platform-label">نوع السؤال</label><select id="q-type" class="platform-select"><option value="mcq">اختيار من متعدد</option><option value="truefalse">صح / خطأ</option><option value="multi">اختيارات متعددة</option><option value="order">ترتيب</option><option value="match">توصيل</option><option value="essay">مقالي</option><option value="file">رفع ملف</option></select></div><div style="grid-column:1/-1"><label class="platform-label">نص السؤال</label><textarea id="q-text" class="platform-textarea" rows="3" required></textarea></div><div><label class="platform-label">الخيارات JSON</label><textarea id="q-options" class="platform-textarea" rows="3" placeholder='["أ", "ب", "ج", "د"]'></textarea></div><div><label class="platform-label">الإجابة الصحيحة</label><input id="q-correct" class="platform-input" placeholder="مثال: 0 أو true أو 0,2"></div><div><label class="platform-label">الدرجة</label><input id="q-points" class="platform-input" type="number" min="1" value="1"></div><div class="platform-actions" style="grid-column:1/-1"><button class="platform-btn primary" type="submit">حفظ السؤال</button></div></form></section><section class="platform-panel" style="margin-top:14px"><h2>الامتحانات</h2><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>الاسم</th><th>المدة</th><th>المحاولات</th><th>النجاح</th><th>النشر</th></tr></thead><tbody id="exams-body"></tbody></table></div></section><section class="platform-panel" style="margin-top:14px"><h2>الأسئلة</h2><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>الامتحان</th><th>النوع</th><th>السؤال</th><th>الدرجة</th><th>التاريخ</th></tr></thead><tbody id="questions-body"></tbody></table></div></section></main><script type="module" src="/platform.js"></script><script type="module" src="/teacher.js"></script></body></html>

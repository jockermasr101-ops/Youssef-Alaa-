<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المتفوقين — منصة يوسف علاء التعليمية</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body class="app-page" data-protected="student"><header class="app-header"><div><div class="brand-title">منصة يوسف علاء التعليمية</div><div class="brand-subtitle">لوحة المتفوقين</div></div><div class="header-actions"><a class="platform-btn" href="/index.html">الرئيسية</a><a class="platform-btn" href="/student-dashboard.html">لوحة الطالب</a><button class="platform-btn" data-logout>خروج</button></div></header><main class="app-main"><div class="page-title"><h1>لوحة المتفوقين</h1><p>الترتيب يظهر من النقاط المسجلة فعليًا للطلاب داخل المنصة.</p></div><section class="platform-panel"><div id="leaderboard-root" class="platform-table-wrap"><div class="platform-empty">جارٍ تحميل القائمة...</div></div></section></main><script type="module" src="/platform.js"></script><script type="module">
window.addEventListener('youssef-auth-ready',async(e)=>{
 const P=window.YoussefAlaaPlatform,root=document.querySelector('#leaderboard-root'); if(!P||!root||!e.detail?.firebaseUser)return;
 try{
   const s=await P.getDocs(P.query(P.collection(P.db,'leaderboard'),P.orderBy('points','desc'),P.limit(100)));
   const rows=s.docs.map((d,i)=>({rank:i+1,id:d.id,...d.data()}));
   const me=e.detail.appUser?.uid;
   root.innerHTML=rows.length?'<table class="platform-table"><thead><tr><th>الترتيب</th><th>الاسم</th><th>الصف</th><th>الشعبة</th><th>النقاط</th></tr></thead><tbody>'+
   rows.map(x=>'<tr style="'+(x.id===me?'background:#eef3ff':'')+'"><td>#'+x.rank+'</td><td><b>'+String(x.displayName||'طالب').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+(x.id===me?' — أنت':'')+'</b></td><td>'+String(x.grade||'—').replace(/[<>]/g,'')+'</td><td>'+String(x.track||'—').replace(/[<>]/g,'')+'</td><td>'+Number(x.points||0).toLocaleString('ar-EG')+'</td></tr>').join('')+
   '</tbody></table>':'<div class="platform-empty">لا توجد نتائج بعد. ستظهر القائمة عند تسجيل الطلاب وتحقيقهم نقاطًا.</div>';
 }catch(err){root.innerHTML='<div class="platform-empty">تعذر تحميل لوحة المتفوقين الآن.</div>'}
});
</script></body></html>

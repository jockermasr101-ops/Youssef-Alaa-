<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساعد المنصة — منصة يوسف علاء التعليمية</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body class="app-page"><header class="app-header"><div><div class="brand-title">منصة يوسف علاء التعليمية</div><div class="brand-subtitle">مساعد المنصة</div></div><div class="header-actions"><a class="platform-btn" href="/index.html">الرئيسية</a><a class="platform-btn" href="/student-dashboard.html">لوحة الطالب</a><button class="platform-btn" data-logout>خروج</button></div></header><main class="app-main"><div class="page-title"><h1>مساعد المنصة</h1><p>مساعد أسئلة وأجوبة داخلية للمنصة بدون بيانات تجريبية.</p></div><section class="platform-panel"><div id="assistant-messages" class="platform-grid"></div><div class="platform-actions" style="margin-top:16px"><button class="platform-btn" data-q="كيف أسجل؟">التسجيل</button><button class="platform-btn" data-q="كيف أدفع؟">الدفع</button><button class="platform-btn" data-q="كيف أفعل الكود؟">تفعيل الكود</button><button class="platform-btn" data-q="لماذا الدرس مقفول؟">الدرس المقفول</button><button class="platform-btn" data-q="كم محاولة للامتحان؟">محاولات الامتحان</button></div><div style="display:flex;gap:8px;margin-top:16px"><input id="assistant-input" class="platform-input" placeholder="اكتب سؤالًا عن استخدام المنصة"><button id="assistant-send" class="platform-btn primary">إرسال</button></div></section></main><script type="module" src="/platform.js"></script><script>
window.addEventListener('youssef-auth-ready',()=>{
 const root=document.querySelector('#assistant-messages'),input=document.querySelector('#assistant-input');
 const answers=[
  [/تسجل|إنشاء حساب/,'لإنشاء حساب: افتح تسجيل الدخول ثم اختر إنشاء حساب، وأكمل البيانات المطلوبة وصورة بطاقة الرقم القومي. الحساب يظل قيد المراجعة حتى اعتماده من الإدارة.'],
  [/دفع|فلوس|تحويل/,'للدفع: اختر الكورس، ارفع صورة إيصال التحويل من صفحة الدفع، وأرسل الطلب للمراجعة. التفعيل يتم بعد اعتماد الإدارة.'],
  [/كود|تفعيل/,'لتفعيل كود: افتح تفعيل الكود، اكتب الكود، ثم أرسله. الكود يستخدم مرة واحدة فقط.'],
  [/مقفول|الدرس/,'قد يكون الدرس مقفولًا لأن الاشتراك غير مفعل أو لأن الدرس السابق لم يصل لنسبة المشاهدة المطلوبة أو لأن امتحان المتطلب لم يُجتز.'],
  [/محاولة|امتحان/,'عدد المحاولات يحدده الامتحان، والافتراضي في المنصة 3 محاولات ما لم يحدد المسؤول إعدادًا آخر.']
 ];
 function add(text,who='المساعد'){const el=document.createElement('div');el.className='platform-panel';el.innerHTML='<b>'+who+'</b><p>'+String(text).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</p>';root.append(el);}
 function ask(q){const clean=String(q||'').trim();if(!clean)return;const hit=answers.find(([rx])=>rx.test(clean));add(clean,'أنت');add(hit?hit[1]:'لم أجد إجابة محددة لهذا السؤال داخل دليل المنصة. استخدم قسم الدعم لإرسال تذكرة للإدارة.');}
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));document.querySelector('#assistant-send')?.addEventListener('click',()=>{ask(input.value);input.value='';});input?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.querySelector('#assistant-send')?.click();}});add('مرحبًا. اكتب سؤالك عن استخدام المنصة.');
});
</script></body></html>

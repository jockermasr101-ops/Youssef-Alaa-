<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محفظة المدرس — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body data-protected="teacher"><header class="app-header"><div><div class="brand-title">منصة يوسف علاء التعليمية</div><div class="brand-subtitle">محفظة المدرس</div></div><div class="header-actions"><a class="platform-btn" href="/teacher-dashboard.html">لوحة المدرس</a><button data-logout class="platform-btn danger">خروج</button></div></header><main class="app-main"><div class="page-title"><h1>محفظتي</h1><p>الرصيد والمبيعات والعمولة وطلبات السحب.</p></div><section class="platform-grid platform-grid-4"><div class="platform-stat"><small>الرصيد الحالي</small><strong id="wallet-balance">0 ج.م</strong></div><div class="platform-stat"><small>إجمالي المبيعات</small><strong id="wallet-sales">0</strong></div><div class="platform-stat"><small>عمولة المنصة</small><strong id="wallet-commission">0</strong></div><div class="platform-stat"><small>المسحوب</small><strong id="wallet-withdrawn">0</strong></div><div class="platform-stat"><small>المعلق</small><strong id="wallet-pending">0</strong></div></section><section class="platform-panel" style="margin-top:14px"><h2>طلب سحب</h2><form id="withdraw-form" class="platform-grid platform-grid-3"><div><label class="platform-label">المبلغ</label><input id="withdraw-amount" class="platform-input" type="number" min="1" required></div><div><label class="platform-label">طريقة السحب</label><select id="withdraw-method" class="platform-select"><option>Vodafone Cash</option><option>InstaPay</option><option>محفظة إلكترونية</option></select></div><div><label class="platform-label">رقم/معرف الحساب</label><input id="withdraw-account" class="platform-input" required></div><div class="platform-actions" style="grid-column:1/-1"><button type="submit" class="platform-btn primary">إرسال طلب السحب</button></div></form></section><section class="platform-panel" style="margin-top:14px"><h2>المعاملات</h2><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>النوع</th><th>المبلغ</th><th>الصافي</th><th>التاريخ</th></tr></thead><tbody id="wallet-tx"></tbody></table></div></section></main><script type="module" src="/platform.js"></script><script type="module" src="/teacher.js"></script></body></html>

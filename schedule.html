<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الجدول الدراسي — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body data-protected="student" data-protected="student"><header class="app-header"><div><div class="brand-title">منصة يوسف علاء التعليمية</div><div class="brand-subtitle">الجدول الدراسي الموحد</div></div><div class="header-actions"><a href="/student-dashboard.html" class="platform-btn">لوحة الطالب</a><button data-logout class="platform-btn danger">خروج</button></div></header><main class="app-main"><div class="page-title"><h1>الجدول الدراسي</h1><p>مواعيد الحصص والاختبارات المرتبطة بكورساتك.</p></div><section id="schedule-list" class="platform-grid platform-grid-2"></section></main><script type="module" src="/platform.js"></script><script>
window.addEventListener('youssef-auth-ready',async(e)=>{
 const P=window.YoussefAlaaPlatform,u=e.detail?.appUser,box=document.querySelector('#schedule-list');
 if(!P||!u||!box||u.role!=='student')return;
 try{
  const en=await P.getDocs(P.query(P.collection(P.db,'enrollments'),P.where('studentUid','==',u.uid),P.limit(100)));
  const allowed=new Set(en.docs.map(d=>d.data()).filter(x=>x.active!==false).map(x=>x.courseId).filter(Boolean));
  const s=await P.getDocs(P.query(P.collection(P.db,'sessions'),P.where('published','==',true),P.limit(200)));
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!x.courseId||allowed.has(x.courseId)).sort((a,b)=>String(a.startAt||'').localeCompare(String(b.startAt||'')));
  box.innerHTML=rows.map(x=>'<article class="platform-panel"><span class="platform-badge">'+esc(x.type||'حصة')+'</span><h3>'+esc(x.title||'حصة')+'</h3><p>'+esc(x.startAt||'')+(x.endAt?' — '+esc(x.endAt):'')+'</p><p style="color:#5b6072">الكورس: '+esc(x.courseId||'عام')+'</p>'+(x.joinUrl?'<a class="platform-btn primary" target="_blank" rel="noopener" href="'+esc(x.joinUrl)+'">الدخول للحصة</a>':'')+'</article>').join('')||'<div class="platform-empty">لا توجد مواعيد مرتبطة بكورساتك حاليًا.</div>';
 }catch(err){box.innerHTML='<div class="platform-empty">تعذر تحميل الجدول.</div>'}
});
</script></body></html>

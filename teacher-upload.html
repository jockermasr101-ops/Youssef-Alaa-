<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رفع الدروس — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body data-protected="teacher"><header class="app-header"><div><div class="brand-title">منصة يوسف علاء التعليمية</div><div class="brand-subtitle">رفع الفيديوهات والملفات والصور</div></div><div class="header-actions"><a href="/teacher-dashboard.html" class="platform-btn">لوحة المدرس</a><button data-logout class="platform-btn danger">خروج</button></div></header><main class="app-main"><div class="page-title"><h1>رفع محتوى جديد</h1><p>اختر كورسًا، ارفع الفيديو/الملف، ثم أرسل الدرس للمراجعة.</p></div><section class="platform-panel"><form id="upload-lesson-form" class="platform-grid platform-grid-2"><div><label class="platform-label">عنوان الدرس</label><input id="lesson-title" class="platform-input" required></div><div><label class="platform-label">معرّف الكورس</label><input id="lesson-course" class="platform-input" required placeholder="courseId"></div><div><label class="platform-label">نوع المحتوى</label><select id="lesson-type" class="platform-select"><option value="video">فيديو</option><option value="pdf">PDF</option><option value="document">Word / مستند</option><option value="image">صورة</option><option value="exam">ملف امتحان</option><option value="note">مذكرة</option></select></div><div><label class="platform-label">رقم الدرس</label><input id="lesson-order" class="platform-input" type="number" min="1" value="1"></div><div style="grid-column:1/-1"><label class="platform-label">وصف الدرس</label><textarea id="lesson-description" class="platform-textarea" rows="3"></textarea></div><div><label class="platform-label">الدرس السابق (اختياري)</label><input id="lesson-prerequisite" class="platform-input" placeholder="lessonId"></div><div><label class="platform-label">امتحان اجتياز قبل التالي (اختياري)</label><input id="lesson-required-exam" class="platform-input" placeholder="examId"></div><div><label class="platform-label">نسبة المشاهدة المطلوبة (%)</label><input id="lesson-required-watch" class="platform-input" type="number" min="0" max="100" value="33"></div><div style="grid-column:1/-1"><label class="platform-label">الملف</label><input id="lesson-file" class="platform-input" type="file" required></div><div style="grid-column:1/-1"><div class="platform-panel" style="background:#f6f7ff"><b>حالة الرفع:</b> <span id="upload-status">جاهز</span><div style="height:8px;background:#e2e7ff;border-radius:99px;overflow:hidden;margin-top:9px"><div id="upload-progress" style="height:100%;width:0;background:#0037b0;transition:width .2s"></div></div></div></div><div class="platform-actions" style="grid-column:1/-1"><button class="platform-btn primary" type="submit" id="upload-lesson-btn">رفع وحفظ</button></div></form></section><section class="platform-panel" style="margin-top:14px"><h2>آخر محتوى مرفوع</h2><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>الدرس</th><th>النوع</th><th>الكورس</th><th>المتطلب</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="uploads-body"></tbody></table></div></section></main><script type="module" src="/platform.js"></script><script>
window.addEventListener('youssef-auth-ready', async (e) => {
  const P = window.YoussefAlaaPlatform;
  const form = document.querySelector('#upload-lesson-form');
  const body = document.querySelector('#uploads-body');
  if (!P || !form) return;

  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const load = async () => {
    if (!body) return;
    try {
      const s = await P.getDocs(P.query(P.collection(P.db,'lessons'), P.where('teacherId','==',P.auth.currentUser.uid), P.limit(300)));
      body.innerHTML = s.docs.map(d => {
        const x = d.data();
        return '<tr><td>'+esc(x.title)+'</td><td>'+esc(x.mediaType)+'</td><td>'+esc(x.courseId)+'</td><td>'+esc(x.prerequisiteLessonId||'—')+'</td><td>'+(x.published?'<span class="platform-badge success">منشور</span>':'<span class="platform-badge warn">مراجعة الإدارة</span>')+'</td><td>'+esc(x.createdAt?.toDate?x.createdAt.toDate().toLocaleString('ar-EG'):'—')+'</td></tr>';
      }).join('') || '<tr><td colspan="6" class="platform-empty">لا توجد ملفات.</td></tr>';
    } catch (err) { body.innerHTML='<tr><td colspan="6" class="platform-empty">تعذر تحميل المحتوى.</td></tr>'; }
  };

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const file = document.querySelector('#lesson-file')?.files?.[0];
    const btn = document.querySelector('#upload-lesson-btn');
    const st = document.querySelector('#upload-status');
    const bar = document.querySelector('#upload-progress');
    const courseId = document.querySelector('#lesson-course')?.value.trim() || '';
    const order = Number(document.querySelector('#lesson-order')?.value || 1);
    if (!file) return P.messageBox('اختر ملف الدرس.');
    if (!courseId) return P.messageBox('اكتب معرّف الكورس.');

    P.setButtonBusy(btn, true, 'جاري الرفع...');
    try {
      const type = document.querySelector('#lesson-type').value;
      const resourceType = type === 'video' ? 'video' : type === 'image' ? 'image' : 'raw';
      st.textContent = 'جاري الرفع إلى Cloudinary...';
      const up = await P.uploadCloudinary(file, {
        resourceType,
        folder: 'youssef-alaa-academy/content/'+type,
        onProgress: p => { bar.style.width = p+'%'; st.textContent='جاري الرفع... '+p+'%'; }
      });

      const lessonRef = await P.addDoc(P.collection(P.db,'lessons'), {
        title:document.querySelector('#lesson-title').value.trim(),
        description:document.querySelector('#lesson-description').value.trim(),
        courseId, order, mediaType:type, mediaUrl:up.secure_url, publicId:up.public_id,
        format:up.format||file.type, fileName:file.name, fileSize:file.size,
        prerequisiteLessonId:document.querySelector('#lesson-prerequisite').value.trim()||null,
        requiredExamId:document.querySelector('#lesson-required-exam').value.trim()||null,
        requiredWatchPercent:Math.max(0,Math.min(100,Number(document.querySelector('#lesson-required-watch').value||33))),
        teacherId:P.auth.currentUser.uid, teacherName:e.detail.appUser?.displayName||'',
        published:false, status:'pending', createdAt:P.serverTimestamp(), updatedAt:P.serverTimestamp()
      });

      if (order === 1) {
        try { await P.updateDoc(P.doc(P.db,'courses',courseId), { firstLessonId:lessonRef.id, updatedAt:P.serverTimestamp() }); } catch (_) {}
      }
      st.textContent='تم الرفع والحفظ للمراجعة.';
      P.messageBox('تم رفع المحتوى وإرساله للمراجعة قبل النشر.','success');
      form.reset();
      document.querySelector('#lesson-required-watch').value='33';
      bar.style.width='0';
      load();
    } catch (err) {
      st.textContent='فشل';
      P.messageBox(err.message||'فشل رفع الملف.');
    } finally { P.setButtonBusy(btn,false); }
  });
  load();
});
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جدول المدرس — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body data-protected="teacher"><header class="app-header"><div><div class="brand-title">منصة يوسف علاء التعليمية</div><div class="brand-subtitle">إدارة الجدول</div></div><div class="header-actions"><a href="/teacher-dashboard.html" class="platform-btn">لوحة المدرس</a><button data-logout class="platform-btn danger">خروج</button></div></header><main class="app-main"><div class="page-title"><h1>جدول حصصي</h1><p>أضف حصة أو اختبارًا ليظهر للطلاب بعد النشر.</p></div><section class="platform-panel"><form id="session-form" class="platform-grid platform-grid-3"><div><label class="platform-label">العنوان</label><input id="s-title" class="platform-input" required></div><div><label class="platform-label">Course ID</label><input id="s-course" class="platform-input" required></div><div><label class="platform-label">النوع</label><select id="s-type" class="platform-select"><option>حصة مباشرة</option><option>مراجعة</option><option>امتحان</option></select></div><div><label class="platform-label">تاريخ/وقت البداية</label><input id="s-start" class="platform-input" type="datetime-local" required></div><div><label class="platform-label">تاريخ/وقت النهاية</label><input id="s-end" class="platform-input" type="datetime-local"></div><div><label class="platform-label">رابط الدخول</label><input id="s-url" class="platform-input" type="url" placeholder="https://..."></div><div class="platform-actions" style="grid-column:1/-1"><button class="platform-btn primary" type="submit">حفظ الحصة</button></div></form></section><section class="platform-panel" style="margin-top:14px"><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>العنوان</th><th>الكورس</th><th>النوع</th><th>البداية</th><th>النشر</th><th>إجراء</th></tr></thead><tbody id="sessions-body"></tbody></table></div></section></main><script type="module" src="/platform.js"></script><script type="module">window.addEventListener('youssef-auth-ready',async(e)=>{const P=window.YoussefAlaaPlatform,u=e.detail?.appUser;if(!u)return;const f=document.querySelector('#session-form'),body=document.querySelector('#sessions-body');const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const load=async()=>{const s=await P.getDocs(P.query(P.collection(P.db,'sessions'),P.where('teacherId','==',P.auth.currentUser.uid),P.limit(100)));body.innerHTML=s.docs.map(d=>{const x=d.data();return `<tr><td>${esc(x.title)}</td><td>${esc(x.courseId)}</td><td>${esc(x.type)}</td><td>${esc(x.startAt)}</td><td>${x.published?'<span class="platform-badge success">منشور</span>':'<span class="platform-badge warn">مسودة</span>'}</td><td>${x.published?'—':`<button class="platform-btn primary" data-p="${d.id}">نشر</button>`}</td></tr>`}).join('')||'<tr><td colspan="6" class="platform-empty">لا توجد حصص.</td></tr>';body.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{await P.updateDoc(P.doc(P.db,'sessions',b.dataset.p),{published:true,updatedAt:P.serverTimestamp()});P.messageBox('تم نشر الحصة.','success');load()})};f.addEventListener('submit',async ev=>{ev.preventDefault();try{await P.addDoc(P.collection(P.db,'sessions'),{title:document.querySelector('#s-title').value.trim(),courseId:document.querySelector('#s-course').value.trim(),type:document.querySelector('#s-type').value,startAt:document.querySelector('#s-start').value,endAt:document.querySelector('#s-end').value,joinUrl:document.querySelector('#s-url').value.trim(),teacherId:P.auth.currentUser.uid,published:false,createdAt:P.serverTimestamp(),updatedAt:P.serverTimestamp()});P.messageBox('تم حفظ الحصة كمسودة.','success');f.reset();load()}catch(err){P.messageBox(err.message)}});load()});</script></body></html>

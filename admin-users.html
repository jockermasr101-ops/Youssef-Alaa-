<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الطلاب — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body data-protected="admin"><main class="app-main"><div class="page-title"><h1>إدارة الطلاب</h1><p>البحث، مراجعة الهوية، التفعيل والتجميد وسجل الطالب.</p></div><div class="platform-panel"><div class="platform-grid platform-grid-2"><div><label class="platform-label">بحث بالاسم / البريد / الهاتف / الرقم القومي</label><input id="user-search" class="platform-input" placeholder="ابحث هنا..."></div><div class="platform-actions" style="align-items:end"><button id="load-users" class="platform-btn primary">تحميل البيانات</button><a href="/admin-dashboard.html" class="platform-btn">العودة للإدارة</a></div></div></div><div class="platform-panel" style="margin-top:14px"><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>الصف</th><th>الحالة</th><th>الدور</th><th>الهوية</th><th>إجراء</th></tr></thead><tbody id="users-body"><tr><td colspan="8" class="platform-empty">جارٍ التحميل...</td></tr></tbody></table></div></div></main><script type="module" src="/platform.js"></script><script type="module">window.addEventListener('youssef-auth-ready',async(e)=>{const P=window.YoussefAlaaPlatform,body=document.querySelector('#users-body'),search=document.querySelector('#user-search');if(!P||!['admin','owner'].includes(e.detail.appUser?.role))return;const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){try{const s=await P.getDocs(P.query(P.collection(P.db,'users'),P.orderBy('createdAt','desc'),P.limit(300)));const q=search.value.trim().toLowerCase();const rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(u=>!q||[u.displayName,u.email,u.studentPhone,u.nationalId].some(v=>String(v??'').toLowerCase().includes(q)));body.innerHTML=rows.map(u=>`<tr><td>${esc(u.displayName)}</td><td>${esc(u.email)}</td><td>${esc(u.studentPhone)}</td><td>${esc(u.grade||'—')}</td><td>${u.status==='suspended'?'<span class="platform-badge danger">موقوف</span>':u.status==='pending'?'<span class="platform-badge warn">قيد المراجعة</span>':'<span class="platform-badge success">نشط</span>'}</td><td><select class="platform-select" data-role-change="${u.id}" ${e.detail?.appUser?.role==='owner'?'':'disabled'}><option value="student" ${u.role==='student'?'selected':''}>طالب</option><option value="teacher" ${u.role==='teacher'?'selected':''}>مدرس</option><option value="ta" ${u.role==='ta'?'selected':''}>مساعد</option><option value="admin" ${u.role==='admin'?'selected':''}>مدير</option></select></td><td>${u.idCardImageUrl?`<a class="platform-btn" target="_blank" rel="noopener" href="${esc(u.idCardImageUrl)}">عرض</a>`:'—'}</td><td><div class="platform-actions">${u.status==='suspended'?`<button class="platform-btn success" data-st="${u.id}" data-v="active">تفعيل</button>`:`<button class="platform-btn danger" data-st="${u.id}" data-v="suspended">تجميد</button>`}</div></td></tr>`).join('')||'<tr><td colspan="8" class="platform-empty">لا توجد نتائج.</td></tr>';document.querySelectorAll('[data-role-change]').forEach(el=>el.onchange=async()=>{try{await P.updateDoc(P.doc(P.db,'users',el.dataset.roleChange),{role:el.value,updatedAt:P.serverTimestamp()});P.messageBox('تم تحديث الدور.','success');load()}catch(err){P.messageBox(err.message)}});document.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{await P.updateDoc(P.doc(P.db,'users',b.dataset.st),{status:b.dataset.v,reviewState:b.dataset.v==='active'?'approved':'rejected',updatedAt:P.serverTimestamp()});P.messageBox('تم تحديث حالة الطالب.','success');load()})}catch(err){body.innerHTML=`<tr><td colspan="8" class="platform-empty">${esc(err.message)}</td></tr>`}}document.querySelector('#load-users').onclick=load;search.addEventListener('input',()=>load());load()});</script></body></html>

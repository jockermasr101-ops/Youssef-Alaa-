<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدفوعات الطلاب — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body data-protected="admin"><main class="app-main"><div class="page-title"><h1>مدفوعات الطلاب</h1><p>مراجعة الإيصالات وتفعيل الاشتراكات بعد الاعتماد.</p></div><section class="platform-panel"><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>الطالب</th><th>الكورس</th><th>المبلغ</th><th>الطريقة</th><th>المرجع</th><th>الإيصال</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="payments-body"></tbody></table></div></section></main><script type="module" src="/platform.js"></script><script type="module">window.addEventListener('youssef-auth-ready',async(e)=>{const P=window.YoussefAlaaPlatform,box=document.querySelector('#payments-body');if(!box||!['admin','owner'].includes(e.detail?.appUser?.role))return;const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const load=async()=>{const s=await P.getDocs(P.query(P.collection(P.db,'paymentSubmissions'),P.orderBy('createdAt','desc'),P.limit(200)));box.innerHTML=s.docs.map(d=>{const x=d.data();return `<tr><td>${esc(x.studentName)}</td><td>${esc(x.courseId)}</td><td>${x.amount} ج.م</td><td>${esc(x.method)}</td><td>${esc(x.reference)}</td><td><a class="platform-btn" target="_blank" rel="noopener" href="${esc(x.receiptUrl)}">عرض</a></td><td>${x.status}</td><td>${x.status==='pending'?`<div class="platform-actions"><button class="platform-btn success" data-pay="${d.id}" data-s="approved">اعتماد</button><button class="platform-btn danger" data-pay="${d.id}" data-s="rejected">رفض</button></div>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="8" class="platform-empty">لا توجد مدفوعات.</td></tr>';document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{try{const ref=P.doc(P.db,'paymentSubmissions',b.dataset.pay);const snap=await P.getDoc(ref);const x=snap.data();await P.updateDoc(ref,{status:b.dataset.s,reviewedBy:P.auth.currentUser.uid,reviewedAt:P.serverTimestamp()});if(b.dataset.s==='approved'&&x.courseId){await P.setDoc(P.doc(P.db,'enrollments',`${x.studentUid}_${x.courseId}`),{studentUid:x.studentUid,courseId:x.courseId,teacherId:x.teacherId||null,source:'manual_payment',amount:x.amount,active:true,createdAt:P.serverTimestamp(),updatedAt:P.serverTimestamp()},{merge:true});await P.addDoc(P.collection(P.db,'notifications'),{userId:x.studentUid,title:'تم اعتماد الدفع',body:'تم تفعيل الكورس المرتبط بطلب الدفع.',read:false,createdAt:P.serverTimestamp()});}P.messageBox('تم تحديث طلب الدفع.','success');load()}catch(err){P.messageBox(err.message)}})};load()});</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب حساب مدرس — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body><main class="app-main" style="max-width:900px"><div class="page-title"><h1>التقديم كمدرس</h1><p>بعد إرسال الطلب، يراجعه المالك/الإدارة ثم يتم تفعيل الحساب.</p></div><section class="platform-panel"><form id="teacher-apply-form" class="platform-grid platform-grid-2"><div><label class="platform-label">الاسم الكامل</label><input id="ta-name" class="platform-input" required></div><div><label class="platform-label">البريد الإلكتروني</label><input id="ta-email" class="platform-input" type="email" required dir="ltr"></div><div><label class="platform-label">رقم الهاتف</label><input id="ta-phone" class="platform-input" type="tel" required dir="ltr"></div><div><label class="platform-label">المادة</label><input id="ta-subject" class="platform-input" required value="الفيزياء"></div><div><label class="platform-label">الصفوف التي تدرّسها</label><input id="ta-grades" class="platform-input" placeholder="1 ثانوي، 2 ثانوي، 3 ثانوي"></div><div><label class="platform-label">كلمة المرور</label><input id="ta-pass" class="platform-input" type="password" minlength="8" required></div><div style="grid-column:1/-1"><label class="platform-label">نبذة عن المدرس</label><textarea id="ta-bio" class="platform-textarea" rows="5"></textarea></div><div class="app-notice" style="grid-column:1/-1">سيتم إنشاء الحساب بحالة «قيد المراجعة» ولن تظهر لك أدوات المدرس قبل الاعتماد.</div><div class="platform-actions" style="grid-column:1/-1"><button id="ta-submit" type="submit" class="platform-btn primary">إرسال طلب المدرس</button><a href="/login.html" class="platform-btn">العودة للدخول</a></div></form></section></main><script type="module" src="/platform.js"></script><script type="module">import {createUserWithEmailAndPassword,updateProfile,signOut} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';window.addEventListener('youssef-auth-ready',()=>{const P=window.YoussefAlaaPlatform,f=document.querySelector('#teacher-apply-form');f.addEventListener('submit',async ev=>{ev.preventDefault();const b=document.querySelector('#ta-submit');P.setButtonBusy(b,true,'جاري إرسال الطلب...');let c=null;try{c=await createUserWithEmailAndPassword(P.auth,document.querySelector('#ta-email').value.trim(),document.querySelector('#ta-pass').value);await updateProfile(c.user,{displayName:document.querySelector('#ta-name').value.trim()});await P.setDoc(P.doc(P.db,'users',c.user.uid),{uid:c.user.uid,email:c.user.email,displayName:document.querySelector('#ta-name').value.trim(),role:'teacher',status:'pending',reviewState:'pending',phone:P.normalizePhone(document.querySelector('#ta-phone').value.trim()),subject:document.querySelector('#ta-subject').value.trim(),grades:document.querySelector('#ta-grades').value.trim(),bio:document.querySelector('#ta-bio').value.trim(),points:0,createdAt:P.serverTimestamp(),updatedAt:P.serverTimestamp()});await signOut(P.auth);P.messageBox('تم إرسال طلب المدرس. انتظر اعتماد الإدارة.','success');setTimeout(()=>P.go('login.html'),1000)}catch(err){if(c?.user)try{await P.signOut()}catch(_){}P.messageBox(err.message||'تعذر إرسال الطلب.')}finally{P.setButtonBusy(b,false)}})});</script></body></html>

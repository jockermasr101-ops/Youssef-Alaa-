<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقارير الأداء — منصة يوسف علاء التعليمية</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body class="app-page" data-protected="student"><header class="app-header"><div><div class="brand-title">منصة يوسف علاء التعليمية</div><div class="brand-subtitle">تقارير الأداء</div></div><div class="header-actions"><a class="platform-btn" href="/student-dashboard.html">لوحة الطالب</a><a class="platform-btn" href="/exam.html">الامتحانات</a><button class="platform-btn" data-logout>خروج</button></div></header><main class="app-main"><div class="page-title"><h1>تقارير الأداء</h1><p>الأرقام هنا مبنية على محاولاتك المسجلة فعليًا.</p></div><section id="performance-root" class="platform-panel"><div class="platform-empty">جارٍ تحميل التقرير...</div></section></main><script type="module" src="/platform.js"></script><script>
window.addEventListener('youssef-auth-ready',async(e)=>{
 const P=window.YoussefAlaaPlatform,u=e.detail?.appUser,root=document.querySelector('#performance-root');if(!P||!u||u.role!=='student'||!root)return;
 const fmt=n=>new Intl.NumberFormat('ar-EG').format(Number(n||0));
 try{
  const s=await P.getDocs(P.query(P.collection(P.db,'examAttempts'),P.where('studentUid','==',u.uid),P.limit(200)));
  const rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  const graded=rows.filter(x=>x.status==='graded'||!x.status), avg=graded.length?Math.round(graded.reduce((sum,x)=>sum+Number(x.percent||0),0)/graded.length):0, best=graded.length?Math.max(...graded.map(x=>Number(x.percent||0))):0, reviewed=rows.filter(x=>x.status==='needs_manual_review').length;
  const date=d=>d?.toDate?d.toDate().toLocaleString('ar-EG'):'—';
  const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  root.innerHTML='<div class="platform-grid platform-grid-4"><div class="platform-stat"><small>إجمالي المحاولات</small><strong>'+fmt(rows.length)+'</strong></div><div class="platform-stat"><small>المتوسط</small><strong>'+avg+'%</strong></div><div class="platform-stat"><small>أفضل نتيجة</small><strong>'+best+'%</strong></div><div class="platform-stat"><small>تحت المراجعة</small><strong>'+fmt(reviewed)+'</strong></div></div><p style="margin-top:12px">نقاط الحساب الحالية: <b>'+fmt(u.points)+'</b></p><div class="platform-table-wrap" style="margin-top:16px"><table class="platform-table"><thead><tr><th>الامتحان</th><th>النتيجة</th><th>الحالة</th><th>النقاط الآلية</th><th>الدرجة اليدوية</th><th>التاريخ</th></tr></thead><tbody>'+(rows.map(x=>'<tr><td>'+esc(x.examId||'—')+'</td><td>'+fmt(x.percent)+'%</td><td>'+esc(x.status==='needs_manual_review'?'مراجعة يدوية':x.passed===true?'ناجح':'غير ناجح')+'</td><td>'+fmt(x.score)+' / '+fmt(x.maxScore)+'</td><td>'+fmt(x.manualAward||0)+' / '+fmt(x.manualPoints||0)+'</td><td>'+date(x.createdAt)+'</td></tr>').join('')||'<tr><td colspan="6" class="platform-empty">لم تسجل أي محاولات بعد.</td></tr>')+'</tbody></table></div>';
 }catch(err){root.innerHTML='<div class="platform-empty">تعذر تحميل تقرير الأداء.</div>'}
});
</script></body></html>

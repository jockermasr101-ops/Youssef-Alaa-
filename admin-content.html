<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المحتوى — منصة يوسف علاء</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform.css"></head><body data-protected="admin"><main class="app-main"><div class="page-title"><h1>إدارة المحتوى</h1><p>مراجعة الكورسات والدروس وإتاحة المحتوى للطلاب.</p></div><div class="platform-panel"><div class="platform-actions"><a href="/admin-dashboard.html" class="platform-btn">العودة للإدارة</a></div></div><section class="platform-panel" style="margin-top:14px"><h2>الكورسات</h2><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>الكورس</th><th>المدرس</th><th>الصف</th><th>الحالة</th><th>السعر</th><th>إجراء</th></tr></thead><tbody id="admin-courses-body"></tbody></table></div></section><section class="platform-panel" style="margin-top:14px"><h2>الامتحانات</h2><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>الامتحان</th><th>المدرس</th><th>الكورس</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="exams-approval-body"></tbody></table></div></section>
<section class="platform-panel" style="margin-top:14px"><h2>الأسئلة</h2><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>الامتحان</th><th>المدرس</th><th>النوع</th><th>السؤال</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="questions-approval-body"></tbody></table></div></section>
<section class="platform-panel" style="margin-top:14px"><h2>الدروس</h2><div class="platform-table-wrap"><table class="platform-table"><thead><tr><th>الدرس</th><th>الكورس</th><th>المدرس</th><th>النوع</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="lessons-body"></tbody></table></div></section></main><script type="module" src="/platform.js"></script><script type="module" src="/admin.js"></script><script type="module">window.addEventListener('youssef-auth-ready',async(e)=>{const P=window.YoussefAlaaPlatform,box=document.querySelector('#lessons-body');if(!box||!['admin','owner'].includes(e.detail?.appUser?.role))return;const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const load=async()=>{try{const s=await P.getDocs(P.query(P.collection(P.db,'lessons'),P.orderBy('createdAt','desc'),P.limit(300)));box.innerHTML=s.docs.map(d=>{const x=d.data();return `<tr><td>${esc(x.title)}</td><td>${esc(x.courseId)}</td><td>${esc(x.teacherName||x.teacherId)}</td><td>${esc(x.mediaType)}</td><td>${x.published?'<span class="platform-badge success">منشور</span>':'<span class="platform-badge warn">مراجعة</span>'}</td><td><button class="platform-btn ${x.published?'danger':'success'}" data-lesson="${d.id}" data-p="${x.published?'false':'true'}">${x.published?'إخفاء':'نشر'}</button></td></tr>`}).join('')||'<tr><td colspan="6" class="platform-empty">لا توجد دروس.</td></tr>';box.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=async()=>{try{await P.updateDoc(P.doc(P.db,'lessons',b.dataset.lesson),{published:b.dataset.p==='true',status:b.dataset.p==='true'?'published':'pending',updatedAt:P.serverTimestamp()});P.messageBox('تم تحديث الدرس.','success');load()}catch(err){P.messageBox(err.message)}})}catch(err){box.innerHTML=`<tr><td colspan="6" class="platform-empty">${esc(err.message)}</td></tr>`}};load()});</script></body></html>
